; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = esp32c3

[common]
; Use the pinned framework defaults: gnu++11 and -Os (verified in verbose build).
build_flags =
  -Wall
;  -Wl,-z,9  ; Enable firmware compression

;  -DDEBUG_RP2040_PORT=Serial
;  -DDEBUG_RP2040_SPI
;  -DESPFC_DEBUG_PIN=2 ; specify pin number (board specific)
;  -DNO_GLOBAL_INSTANCES
;  -DESPFC_DEV_PRESET_MODES
;  -DESPFC_DEV_PRESET_BLACKBOX=1 ; specify port number (board specific)
;  -DESPFC_DEV_PRESET_DSHOT
;  -DESPFC_DEV_PRESET_SCALER

esp32_upload_speed = 921600
esp32_monitor_speed = 115200

[env]
; monitor_filters = esp8266_exception_decoder

[env:esp32c3]
; ESP-C3-12F uses this existing C3 build preset, not the physical DevKitM-1 board.
; Flash/partition/QIO/port settings below are inherited and NOT hardware-verified.
board = esp32-c3-devkitm-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom.csv
board_upload.flash_size = 2MB
; Initial override only: platform derives the effective app limit from custom.csv (app0).
board_upload.maximum_size = 2097152
; CD74HC4067 is the sole local library, pinned by its gitlink commit.
lib_deps =
  https://github.com/h2zero/NimBLE-Arduino.git#5ae2c43f62c5a588a25c1de68f7d17b6f3b75adb
; NimBLE-Arduino 2.5.1: immutable upstream commit, no HID fork or generated overlay.
extra_scripts =
  pre:scripts/prepare_build.py
  post:scripts/prepare_flash_plan.py
  post:scripts/upload_guard.py
build_flags =
  ${common.build_flags}
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
upload_speed = ${common.esp32_upload_speed}
monitor_speed = ${common.esp32_monitor_speed}
; Ports deliberately unset: auto-selection or CLI --upload-port / monitor --port.
